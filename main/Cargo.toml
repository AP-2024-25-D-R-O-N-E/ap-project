[package]
name = "ap-project"
version = "0.1.0"
edition = "2021"

[dependencies]
wg_2024 = { git = "https://github.com/WGL-2024/WGL_repo_2024.git", features = ["serialize"] }
toml = "0.8.19"
crossbeam = "0.8.4"
simple_logger = "5.0.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4.22"
colored = "2.1.0"
egui_graphs = { git = "https://github.com/mattia-marini/egui_graphs.git", features = ["events"] }
egui = "0.29"
egui_extras = {version = "0.29", features = ["syntect", "all_loaders"]}
image = { version = "0.25", features = ["jpeg", "png"] }
eframe = "0.29.1"
serde_json = "1.0"
petgraph = "0.6"
rand = "0.8"
syntect = "5.2"    
tempfile = "3"
lazy_static = "1.5.0"
egui-file-dialog = "0.7.0"
d-r-o-n-e_drone = { git = "https://github.com/AP-2024-25-D-R-O-N-E/drone.git"}
lockheedrustin-drone = { git = "https://github.com/Lockheed-Rustin/drone.git" }
ap2024_unitn_cppenjoyers_drone = { git = "https://github.com/Cpp-enjoyers/drone.git" }
rusty_drones = { git = "https://github.com/rusty-drone-2024/rusty-drone.git" }
rust-roveri = { git = "https://github.com/RustRoveri/rust-roveri.git" }
rustbusters-drone = { git = "https://github.com/Rustbusters/drone.git" }
rustafarian-drone = { git = "https://github.com/Rustafarian-Unitn/rustafarian-drone"}
skylink = { git = "https://github.com/Suge42/Skylink_drone.git" }
LeDron_James = { git = "https://github.com/anass03/LeDron_James.git"}
getdroned = { git = "https://github.com/GetDroned/Drone.git", features = ["log"] }
rusteze_drone = { git = "https://github.com/Rusteze-AP/drone.git", branch = "main" }
macros = { path = "../macros" }
bincode = "1.3.3"
